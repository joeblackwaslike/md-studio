[flake8]
format = wemake
show-source = true
statistics = false
doctests = true
max-imports = 17
extend-exclude =
  .venv
select = WPS, E999
per-file-ignores =
  tests/**/*.py: WPS118, WPS202, WPS204, WPS211, WPS221, WPS226, WPS237, WPS432
  src/md_studio/__init__.py: WPS412, WPS420
  src/md_studio/*/__init__.py: WPS412
  tests/__init__.py: WPS412
  tests/**/__init__.py: WPS412
  tests/conftest.py: WPS411, WPS412
